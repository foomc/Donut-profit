name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build
        run: |
          set -o pipefail
          gradle build --console=plain 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo '## Compile errors'
            echo '```'
            grep -E -A2 "error:" build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: donut-profit-jar
          path: build/libs/donut-profit-1.0.0.jar
